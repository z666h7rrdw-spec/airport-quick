<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c3c69"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Airport Quick</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#07152f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#0c3c69;color:#fff;text-align:center;padding:calc(9px + env(safe-area-inset-top)) 12px 10px;font-size:23px;font-weight:800}main{max-width:560px;margin:auto;padding:14px}input{width:100%;font-size:19px;padding:14px 16px;border-radius:15px;border:1px solid #d9e1ea;outline:none}.card{background:#fff;margin-top:13px;padding:19px;border:1px solid #dce4ec;border-radius:20px;box-shadow:0 5px 20px #1232}.id{font-size:36px;font-weight:850}.name{font-size:20px;font-weight:750}.muted{color:#617087}.call{margin-top:7px}hr{border:0;border-top:1px solid #e3e9ef;margin:15px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.v{font-weight:800;text-align:right}.sec{font-size:12px;font-weight:800;letter-spacing:.8px;color:#617087;margin:12px 0 4px}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:750;background:#e7f1ff;color:#075dcc;margin-top:14px}.sheet{display:none;margin-top:12px;padding:15px;border-radius:17px;background:#f0f5fa}.inputs{display:flex;gap:9px}.inputs input{font-size:18px;padding:11px}.result{font-size:16px;font-weight:750;line-height:1.55;margin-top:11px}.empty{text-align:center;color:#617087;padding:35px 5px}.note{font-size:11px;color:#718096;text-align:center;padding:16px 8px 30px}.tp{font-size:13px;color:#617087;margin-top:2px}.suggest{background:white;border:1px solid #dce4ec;border-radius:14px;margin-top:5px;overflow:hidden}.suggest div{padding:11px 14px;border-top:1px solid #eef2f6}.suggest div:first-child{border-top:0}
</style></head><body><header>Airport Quick</header><main><input id="search" placeholder="Airport name or identifier" autocomplete="off" autocapitalize="characters"><div id="sug"></div><div id="out"><div class="empty">Search a Virginia airport to begin.</div></div><div class="note">FAA NASR data effective Sep 3, 2026. Verify current NOTAMs and aeronautical information before flight.</div></main><script>
let A=[],current=null;fetch('airports.json').then(r=>r.json()).then(x=>A=x);const q=document.getElementById('search'),out=document.getElementById('out'),sug=document.getElementById('sug');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function traffic(r){return r.ends.map(e=>e.id+' '+e.traffic).join(' · ')}
function render(a){current=a;sug.innerHTML='';q.value=a.id;let rw=a.runways.map(r=>`<div class="row"><span>Runway ${esc(r.id)}</span><span class="v">${r.length?Number(r.length).toLocaleString()+' ft':''}</span></div><div class="tp">Traffic: ${esc(traffic(r))}</div>`).join('');let fq=a.freqs.map(x=>`<div class="row"><span>${esc(x[0])}</span><span class="v">${esc(x[1])}</span></div>`).join('');out.innerHTML=`<div class="card"><div class="id">${esc(a.id)}</div><div class="name">${esc(a.name)}</div><div class="muted">${esc(a.city)}</div><div class="call"><b>Radio Call:</b> ${esc(a.call)}</div><hr><div class="row"><span>Elevation</span><span class="v">${a.elev.toLocaleString()} ft MSL</span></div><div class="sec">RUNWAYS</div>${rw}<div class="sec">FREQUENCIES</div>${fq||'<div class="muted">No selected frequencies in FAA dataset.</div>'}<button onclick="toggleX()">Crosswind Calculator</button><div class="sheet" id="xs"><div class="inputs"><input id="wd" type="number" inputmode="numeric" placeholder="Wind °"><input id="ws" type="number" inputmode="decimal" placeholder="Knots"></div><div id="xr" class="result"></div></div></div>`;}
q.addEventListener('input',()=>{let s=q.value.trim().toLowerCase();if(!s){sug.innerHTML='';out.innerHTML='<div class="empty">Search a Virginia airport to begin.</div>';return}let m=A.filter(a=>a.id.toLowerCase().includes(s)||a.faa.toLowerCase().includes(s)||a.name.toLowerCase().includes(s)||a.city.toLowerCase().includes(s)).slice(0,6);if(m.length===1&&(m[0].id.toLowerCase()===s||m[0].faa.toLowerCase()===s)){render(m[0]);return}sug.innerHTML=m.length?'<div class="suggest">'+m.map(a=>`<div onclick="pick('${a.id}')"><b>${esc(a.id)}</b> — ${esc(a.name)}</div>`).join('')+'</div>':'';});
function pick(id){render(A.find(a=>a.id===id))}function toggleX(){let x=document.getElementById('xs');x.style.display=x.style.display==='block'?'none':'block';if(x.style.display==='block'){document.getElementById('wd').addEventListener('input',calc);document.getElementById('ws').addEventListener('input',calc)}}
function calc(){let d=+document.getElementById('wd').value,s=+document.getElementById('ws').value,el=document.getElementById('xr');if(!Number.isFinite(d)||!Number.isFinite(s)||d<0||d>360||s<0){el.innerHTML='Enter wind direction (0–360°) and speed.';return}let lines=[];current.runways.forEach(r=>r.ends.forEach(e=>{let h=e.heading;if(h==null){let n=parseInt(e.id,10);h=(n===36?360:n*10)}let rad=(d-h)*Math.PI/180,head=s*Math.cos(rad),cross=s*Math.sin(rad);let along=head>=0?`Headwind ${Math.abs(head).toFixed(1)} kt`:`Tailwind ${Math.abs(head).toFixed(1)} kt`;let side=Math.abs(cross)<0.05?'No crosswind':`Crosswind ${Math.abs(cross).toFixed(1)} kt from ${cross>0?'right':'left'}`;lines.push(`RWY ${esc(e.id)}: ${along} · ${side}`)}));el.innerHTML=lines.join('<br>')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
